<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI English Coach - 学習者向け</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&family=Poppins:wght@600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #4A90E2;
            --bg-color: #f8f9fa;
            --text-color: #333;
        }
        body {
            font-family: 'Noto Sans JP', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            width: 90%;
            max-width: 600px;
            text-align: center;
        }
        h1 {
            font-family: 'Poppins', sans-serif;
            color: var(--primary-color);
            margin-bottom: 24px;
        }
        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
        }
        input {
            flex: 1;
            padding: 14px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 18px;
            outline: none;
            transition: border-color 0.3s;
        }
        input:focus {
            border-color: var(--primary-color);
        }
        button {
            padding: 14px 24px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, opacity 0.2s;
        }
        button:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }
        #result {
            text-align: left;
            background: #fff;
            border-top: 2px solid #f0f0f0;
            padding-top: 20px;
            min-height: 100px;
        }
        .ai-badge {
            display: inline-block;
            background: #e1f0ff;
            color: #1a73e8;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .ai-text {
            line-height: 1.8;
            white-space: pre-wrap;
            color: #444;
        }
        .loading { color: #aaa; font-style: italic; text-align: center; }
    </style>
</head>
<body>

<div class="container">
    <h1>AI English Coach 🎓</h1>
    <div class="search-box">
        <input type="text" id="wordInput" placeholder="英単語やフレーズを入力...">
        <button onclick="askGemini()">検索</button>
    </div>

    <div id="result">
        <p style="color: #999; text-align: center;">調べたい単語を入力して、AIコーチに聞いてみましょう！</p>
    </div>
</div>

<script>
    // --- 【重要】公開時はここを隠す必要があります ---
    async function askGemini() {
    const word = document.getElementById('wordInput').value;
    const resultDiv = document.getElementById('result');
    if (!word) return;

    resultDiv.innerHTML = '<div class="loading">AIコーチが解説を作成中... 📝</div>';

    // 発音
    const uttr = new SpeechSynthesisUtterance(word);
    uttr.lang = 'en-US';
    window.speechSynthesis.speak(uttr);

    try {
        // 直接Geminiを叩かず、自分の作った「秘密のポスト(/api/chat)」に送る
        const response = await fetch("/api/chat", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ word: word })
        });

        const data = await response.json();
        const aiResponse = data.candidates[0].content.parts[0].text;

        resultDiv.innerHTML = `
            <span class="ai-badge">AI解説</span>
            <div class="ai-text">${aiResponse}</div>
        `;
    } catch (error) {
        resultDiv.innerHTML = "<p style='color:red;'>エラーが発生しました。設定を確認してください。</p>";
    }
}
        }
    }
</script>

</body>

</html>
